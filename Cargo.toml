[package]
name = "virt-linux"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Manage Linux VMs on Linux hosts via QEMU/KVM — Rust sibling of virt-macos"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
