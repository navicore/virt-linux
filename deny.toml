# cargo-deny configuration — license compliance gate.
#
# The project is MIT; every dependency must be permissive. `cargo deny check
# licenses` (via `just license-audit`, part of `just ci`) fails if a new
# dependency introduces a license outside this allow-list — that is the cue
# to reject the dep, not to widen the list.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
]
